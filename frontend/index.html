<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Auth Portal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- 3D Floating Shapes -->
    <div class="cube shape-1"></div>
    <div class="sphere shape-2"></div>
    <div class="torus shape-3"></div>

    <div class="container" id="container">
        
        <!-- Login Form -->
        <div class="form-box login-box active">
            <form id="loginForm">
                <h2>Welcome Back</h2>
                <p class="subtitle">Enter your credentials to access your account</p>
                
                <div class="input-group">
                    <input type="email" id="loginEmail" required>
                    <label>Email Address</label>
                    <span class="highlight"></span>
                </div>

                <div class="input-group">
                    <input type="password" id="loginPassword" required>
                    <label>Password</label>
                    <span class="highlight"></span>
                </div>

                <button type="submit" class="btn-3d">
                    <span>Sign In</span>
                </button>

                <p class="switch-text">
                    Don't have an account? <a href="#" id="toSignup">Create One</a>
                </p>
            </form>
        </div>

        <!-- Signup Form -->
        <div class="form-box signup-box">
            <form id="signupForm">
                <h2>Create Account</h2>
                <p class="subtitle">Join us and experience the next generation UI</p>

                <div class="input-group">
                    <input type="text" id="signupName" required>
                    <label>Full Name</label>
                    <span class="highlight"></span>
                </div>

                <div class="input-group">
                    <input type="email" id="signupEmail" required>
                    <label>Email Address</label>
                    <span class="highlight"></span>
                </div>

                <div class="input-group">
                    <input type="password" id="signupPassword" required>
                    <label>Password</label>
                    <span class="highlight"></span>
                </div>

                <button type="submit" class="btn-3d signup-btn">
                    <span>Sign Up</span>
                </button>

                <p class="switch-text">
                    Already have an account? <a href="#" id="toLogin">Sign In</a>
                </p>
            </form>
        </div>

    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
